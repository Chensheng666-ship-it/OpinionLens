; mypy config -- M6a "type-check subset" (docs/ review roadmap, P2 -> type checking).
;
; Usage (the project venv has no pip; use uv):
;   uvx mypy app/sidecar app/engine      # explicit targets
;   uvx mypy                             # bare run uses `files` below
;
; Design rules:
;   1. Real type problems in production code (app/sidecar, app/engine) are fixed in the code,
;      never silenced;
;   2. Only three kinds of reluxation are allowed, each documented inline right here:
;      runtime monkeypatching of upstream objects / third-party libs without stubs /
;      dict shapes guaranteed by app/CONTRACT.md;
;   3. No blanket `ignore_errors = True` per file, except the fake/probe scripts that now
;      live under tests/fixtures and tests/tools (reason written at the bottom of this file).
;
; NOTE: this file is ASCII on purpose -- mypy reads .ini files with the *locale* encoding
; (cp936/GBK on this Windows box), so non-ASCII comments make mypy crash before checking
; anything: "UnicodeDecodeError: 'gbk' codec can't decode byte 0x80". Keep it ASCII.

[mypy]
python_version = 3.11
; The type-check environment (uvx mypy) has no runtime deps and no stubs for
; openpyxl/pandas/fastapi: missing modules or missing stubs are not errors here.
; Their API is treated as Any on the checking side.
ignore_missing_imports = True
; app/desktop is plain JS (node --check covers it), MediaCrawler/ is read-only upstream,
; build/ is generated output.
exclude = (?x)(^build/|^MediaCrawler/|node_modules|^app/desktop/)
; Guard in the other direction: a wrong or no-longer-needed ignore is reported, so
; relaxations cannot rot silently inside the code.
warn_unused_ignores = True
show_error_codes = True
; CLI arguments override this; it only makes a bare `uvx mypy` run meaningful.
; R1 moved tests/fixtures + tests/tools out of app/; they are checked together with app/ so a
; bare `uvx mypy` keeps covering the test harness (loose sections for them are below).
files = app/sidecar, app/engine, tests


; =========================================================================
; Third-party libs without stubs: their imports are already allowed by
; ignore_missing_imports, these sections only cover code that reads Any
; results and is therefore misreported.
; =========================================================================

; openpyxl ships no stubs: Workbook/Worksheet are Any, so cell/row access cannot be
; narrowed. The column layout itself is contract-checked in export_specs.py
; (14 tables, EXPORT_SCHEMA_MISMATCH self-test), not by the type checker.
[mypy-exporter]
disable_error_code = attr-defined, union-attr, call-overload

; pandas is Any here as well; DataFrame shape is guaranteed by the report_dataset
; contract and covered by test_report_data.py assertions.
[mypy-report_dataset]
disable_error_code = attr-defined, union-attr


; =========================================================================
; Tests / self-test scripts (tests/python; no __init__.py there, so the mypy module names
; are still `test_*` / `selftest` -- section names below stay unchanged).
; Fixtures are heterogeneous dicts built per assertion and wired with dynamic
; monkeypatching; their shape is enforced by each case's check().
; Only the codes actually observed are disabled -- name-defined / import errors stay
; enabled because they usually point at real typos.
; =========================================================================
[mypy-test_exporter]
; openpyxl has no stubs -> cell values are `object`; fixtures build row dicts ad hoc.
disable_error_code = arg-type, assignment, attr-defined, call-overload, dict-item, operator, union-attr

[mypy-test_engine]
; Event fixtures are list[dict] scripts; ~26 empty list/dict literals would need
; annotations with no type value for a test.
disable_error_code = arg-type, assignment, func-returns-value, return-value, var-annotated

[mypy-selftest]
; End-to-end self-test: raw HTTP response dicts, optional global FakeLLMServer handle,
; subscript access on values checked at runtime.
disable_error_code = assignment, attr-defined, index, operator, union-attr, var-annotated

[mypy-test_notify]
; check(cond, list|Any): the assertion condition passes the value under test itself.
disable_error_code = arg-type, union-attr

[mypy-test_report_data]
; TypedDict fixtures (StatsBlock/ReportPackage) are passed to functions typed
; dict[str, Any]. A TypedDict is not a dict subtype (invariant keys); runtime behaviour
; is identical, this is a contract-shape difference only.
disable_error_code = arg-type, typeddict-item

[mypy-test_llm]
; lambdas fake provider callbacks; parameter types are not inferable by design.
disable_error_code = misc

[mypy-test_run_manager]
; check(ok, backend.last_params.get("x")): condition passes a possibly-None value.
disable_error_code = arg-type

[mypy-test_account_pool]
; Nothing but the fastapi import (already allowed); everything else stays strict.
disable_error_code = import-not-found


; =========================================================================
; Fake / probe scripts: pure dynamic probe code, untyped by design. They emulate
; third-party HTTP protocols or are throwaway capture probes, and no production path
; imports them (tests and manual debugging only).
; R1 layout: fakes live in tests/fixtures, probes in tests/tools.
; This is the ONLY place in this config using ignore_errors -- reason is the above.
; =========================================================================
[mypy-_fake_engine]
ignore_errors = True

[mypy-_fake_exporter]
ignore_errors = True

[mypy-_fake_llm_server]
ignore_errors = True

[mypy-_fake_notify_server]
ignore_errors = True

[mypy-_fake_report_data]
ignore_errors = True

[mypy-_real_login_check]
ignore_errors = True

[mypy-_probe_xhs_login]
ignore_errors = True

; Raw CDP/Playwright capture probe: JSON payloads are Any, dict shapes vary per platform.
[mypy-probe_platform_qr]
ignore_errors = True

; Playwright request-capture probe: list of ad-hoc capture dicts.
[mypy-diagnose_ks_pagination]
ignore_errors = True
