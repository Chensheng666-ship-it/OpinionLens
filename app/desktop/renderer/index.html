<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src http://127.0.0.1:* http://localhost:*;">
  <meta name="color-scheme" content="light">
  <title>舆见 OpinionLens</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app">

    <!-- 左侧导航 -->
    <aside class="sidebar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 28 28" fill="none" aria-hidden="true">
          <circle cx="11.4" cy="14" r="6.3" stroke="currentColor" stroke-width="1.7"/>
          <circle cx="11.4" cy="14" r="1.95" fill="var(--accent-on-dark)" stroke="none"/>
          <path d="M19.6 8.6a10.2 10.2 0 0 1 0 10.8" stroke="var(--accent-on-dark)" stroke-width="1.7" stroke-linecap="round"/>
          <path d="M23.4 6.4a14.4 14.4 0 0 1 0 15.2" stroke="var(--accent-on-dark)" stroke-width="1.7" stroke-linecap="round" opacity=".55"/>
        </svg>
        <div class="brand-text">
          <b>舆见</b>
          <span>OpinionLens · 采集 + AI 周报</span>
        </div>
      </div>

      <nav class="nav" id="nav" aria-label="主导航">
        <button class="nav-item" data-page="accounts" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-users"></use></svg>
          <span>平台账号</span>
        </button>
        <button class="nav-item" data-page="tasks" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-radar"></use></svg>
          <span>采集任务</span>
        </button>
        <button class="nav-item" data-page="reports" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-report"></use></svg>
          <span>报告中心</span>
        </button>
        <button class="nav-item" data-page="settings" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-settings"></use></svg>
          <span>设置</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="side-service" id="side-service">
          <span class="dot dot-muted"></span><span>本地服务：连接中</span>
        </div>
        <div class="side-meta">
          <span id="side-version">v0.1.0</span>
          <span class="side-sep">·</span>
          <span>Windows 桌面端</span>
        </div>
      </div>
    </aside>

    <!-- 右侧工作区 -->
    <div class="workspace">
      <header class="topbar">
        <div class="topbar-heading">
          <h1 id="page-title">平台账号</h1>
          <p id="page-sub">扫码登录平台账号，登录态保存在本机</p>
        </div>
        <div class="topbar-status" id="topbar-status"></div>
      </header>

      <div class="global-banner" id="global-banner" hidden></div>

      <main class="view" id="view" tabindex="-1">
        <div class="boot-loading">
          <div class="boot-spinner"></div>
          <p>正在初始化工作台…</p>
        </div>
      </main>
    </div>
  </div>

  <div class="modal-root" id="modal-root"></div>
  <div class="toast-root" id="toast-root" aria-live="polite" aria-atomic="false"></div>

  <!-- 图标 sprite（内联，无外部资源） -->
  <svg xmlns="http://www.w3.org/2000/svg" class="sprite" aria-hidden="true">
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19.5c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><circle cx="17.2" cy="9.2" r="2.4"/><path d="M16.4 14.7c2.5.2 4.3 1.9 4.4 4.3"/></symbol>
    <symbol id="i-radar" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.6"/><path d="M12 12 18.4 5.8"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4.2V10h-5.6"/></symbol>
    <symbol id="i-qr" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1"/><rect x="5.5" y="5.5" width="2.5" height="2.5" fill="currentColor" stroke="none"/><rect x="14" y="3.5" width="6.5" height="6.5" rx="1"/><rect x="16" y="5.5" width="2.5" height="2.5" fill="currentColor" stroke="none"/><rect x="3.5" y="14" width="6.5" height="6.5" rx="1"/><rect x="5.5" y="16" width="2.5" height="2.5" fill="currentColor" stroke="none"/><path d="M14 14h2.5v2.5H14zM18 14h2.5M18 18h2.5v2.5H18zM14 20.5h2.5"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 20 6v5.7c0 4.7-3.3 7.7-8 9.3-4.7-1.6-8-4.6-8-9.3V6z"/><path d="M9 11.8l2.2 2.2 4-4.2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3.6 2.8 20h18.4z"/><path d="M12 9v5.2"/><circle cx="12" cy="17.3" r=".9" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.8"/><path d="M12 11v5.2"/><circle cx="12" cy="7.9" r=".9" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.8"/><path d="M12 7.6v5.2"/><circle cx="12" cy="16.4" r=".9" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7A2 2 0 0 1 5.5 5h3.6l2 2.2h7.4a2 2 0 0 1 2 2v7.3a2 2 0 0 1-2 2H5.5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4.5h5.5V10"/><path d="M19.5 4.5 11 13"/><path d="M18 13.5v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9.5a2 2 0 0 1 2-2h5"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8.5 5.4v13.2L20 12z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.8" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3.5v12M7 10.5l5 5 5-5M4.5 20.5h15"/></symbol>
    <symbol id="i-file-excel" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9.2 12.5l5 6M14.2 12.5l-5 6"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9.5l3 2.8-3 2.8M13 15.5h4"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.8"/><path d="M12 6.8V12l3.2 2"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M6 9.5l6 6 6-6"/></symbol>
    <symbol id="i-server" viewBox="0 0 24 24"><rect x="3" y="3.8" width="18" height="7" rx="2"/><rect x="3" y="13.2" width="18" height="7" rx="2"/><circle cx="7" cy="7.3" r=".9" fill="currentColor" stroke="none"/><circle cx="7" cy="16.7" r=".9" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-browser" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/><circle cx="6.2" cy="6.5" r=".6" fill="currentColor" stroke="none"/><circle cx="8.4" cy="6.5" r=".6" fill="currentColor" stroke="none"/><circle cx="10.6" cy="6.5" r=".6" fill="currentColor" stroke="none"/><path d="M7.5 12.5h6M7.5 16h9"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4.5V10h5.5"/><path d="M12 7.8V12l3 1.8"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20l4.2-1L20 7.2 16.8 4 5 15.8z"/><path d="M14.5 6.3l3.2 3.2"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.8" y="10.5" width="14.4" height="9.5" rx="2"/><path d="M8 10.5V7.8a4 4 0 0 1 8 0v2.7"/></symbol>
    <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l2.4-6.5 4.6 13 2.4-6.5H21"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.8"/><path d="M3.4 12h17.2M12 3.2c2.6 2.3 4 5.4 4 8.8s-1.4 6.5-4 8.8c-2.6-2.3-4-5.4-4-8.8s1.4-6.5 4-8.8z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V5.2c0-.7.5-1.2 1.2-1.2h2.6c.7 0 1.2.5 1.2 1.2V7"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v5.5M14 11v5.5"/></symbol>
    <symbol id="i-report" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M8.5 17.5v-3.2M12 17.5v-5.4M15.5 17.5v-2"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.1"/><circle cx="12" cy="12" r="7.7"/><path d="M12 2.6v2.4M12 19v2.4M2.6 12h2.4M19 12h2.4M5.4 5.4l1.7 1.7M16.9 16.9l1.7 1.7M18.6 5.4l-1.7 1.7M7.1 16.9l-1.7 1.7"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8.6a6 6 0 1 0-12 0c0 4.8-2 6.4-2 6.4h16s-2-1.6-2-6.4z"/><path d="M10.2 19a2.1 2.1 0 0 0 3.6 0"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.4l2.7 5.5 6.1.9-4.4 4.3 1 6-5.4-2.8-5.4 2.8 1-6L3.2 9.8l6.1-.9z"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="7.8" cy="14.2" r="3.8"/><path d="M10.7 11.3 20.5 4M16.5 7.4l2 2.1M14 9.4l2.1 2.1"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3.5 10.2 14.3"/><path d="M21 3.5 14.4 21l-4.2-6.7L3.5 10z"/></symbol>
  </svg>

  <!-- 主包：preview.js（112 KB mock）不在此静态引入，由 app.js 在预览模式下动态加载 -->
  <script src="api.js"></script>
  <script src="datepicker.js"></script>
  <script src="app.js"></script>
  <script src="ui-kit.js"></script>
  <script src="accounts.js"></script>
  <script src="tasks.js"></script>
  <script src="reports.js"></script>
  <script src="settings.js"></script>
</body>
</html>
