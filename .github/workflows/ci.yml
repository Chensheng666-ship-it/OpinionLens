name: CI

# 离线自测：不联网、不启动真实浏览器、不需要 MediaCrawler 源码。
# 说明：
#   - 采集引擎（app/engine/test_engine.py）需要本机安装 MediaCrawler（非商业许可，不随仓库分发），
#     因此 CI 不跑 engine 测试；它在本地用 `scripts/setup_mediacrawler.ps1` 安装后由 selftest 覆盖。
#   - 其余测试使用 fake engine / fake LLM / fake 通知服务，可在干净环境直接运行。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Offline tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Python compile check
        run: python -m compileall -q app

      - name: JavaScript syntax check
        shell: pwsh
        run: |
          node --check app/desktop/main.js
          node --check app/desktop/preload.js
          Get-ChildItem app/desktop/renderer/*.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Offline test suites
        shell: pwsh
        run: |
          $tests = @(
            'app/sidecar/test_notify.py',
            'app/sidecar/test_llm.py',
            'app/sidecar/test_account_pool.py',
            'app/sidecar/test_report_data.py',
            'app/sidecar/test_exporter.py'
          )
          foreach ($t in $tests) {
            Write-Host "=== $t ==="
            python $t
            if ($LASTEXITCODE -ne 0) { Write-Error "FAILED: $t"; exit $LASTEXITCODE }
          }

      - name: Sidecar offline selftest
        run: python app/sidecar/selftest.py
