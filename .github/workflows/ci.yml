name: CI

# 离线自测：不联网、不启动真实浏览器、不需要 MediaCrawler 源码。
# 说明：
#   - 采集引擎（tests/python/test_engine.py）需要本机安装 MediaCrawler（非商业许可，不随仓库分发），
#     因此 CI 不跑 engine 测试；它在本地用 `scripts/setup_mediacrawler.ps1` 安装后由 selftest 覆盖。
#   - 其余测试使用 fake engine / fake LLM / fake 通知服务，可在干净环境直接运行。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Offline tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
      # 与开发环境一致的本地时区：测试里的日期窗口/静默时段判断依赖本地时间，
      # Windows runner 默认 UTC，统一到 Asia/Shanghai 避免时区导致的假失败。
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Python compile check
        run: python -m compileall -q app tests

      - name: JavaScript syntax check
        shell: pwsh
        run: |
          node --check app/desktop/main.js
          node --check app/desktop/preload.js
          Get-ChildItem app/desktop/renderer/*.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Offline test suites
        shell: pwsh
        run: |
          $tests = @(
            'tests/python/test_notify.py',
            'tests/python/test_llm.py',
            'tests/python/test_account_pool.py',
            'tests/python/test_report_data.py',
            'tests/python/test_exporter.py',
            'tests/python/test_run_manager.py'
          )
          foreach ($t in $tests) {
            Write-Host "=== $t ==="
            python $t
            if ($LASTEXITCODE -ne 0) { Write-Error "FAILED: $t"; exit $LASTEXITCODE }
          }

      - name: Sidecar offline selftest
        run: python tests/python/selftest.py

  # ---------------------------------------------------------------------------
  # e2e 冒烟（真实 Electron 窗口 + 主进程 IPC）
  # 覆盖范围：e2e 只覆盖 UI/IPC —— 窗口加载无未捕获 JS 错误、fsapi.getInfo() 字段、
  #   设置→关于 两张卡渲染、migrateDataDir 参数校验、preview.js 未静态加载、ui-kit 生效、
  #   切页后 FS.timers 不泄漏；sidecar 全链路（采集/导出/报告/通知）由 offline-tests job
  #   的单元测试 + selftest.py 覆盖，不在本 job 重复。
  # 必须 -NoSidecar：CI 没有 MediaCrawler（非商业许可，不随仓库分发），sidecar 起不来；
  #   此时「feed 增量参数 400」断言自动记 SKIP，其余断言照跑。
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E smoke (Windows, no sidecar)
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      # 与开发环境一致的本地时区（渲染层日期/版本展示依赖本地时间）
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/desktop/package-lock.json

      - name: Install Electron dependencies
        working-directory: app/desktop
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          npm_config_registry: https://registry.npmmirror.com
        run: npm ci

      - name: Run e2e smoke (no sidecar)
        shell: pwsh
        run: pwsh -File app/scripts/e2e/run_e2e.ps1 -NoSidecar

      - name: Upload e2e logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ github.run_id }}
          path: build/e2e/**
          if-no-files-found: ignore
          retention-days: 7
